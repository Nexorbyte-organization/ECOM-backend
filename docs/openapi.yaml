        application for the event with `referredBy` tagged.
      operationId: acceptReferral
      parameters:
        - name: referralId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Referral accepted, application created/updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Application' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /usher/referrals/{referralId}/decline:
    patch:
      tags: [Ushers]
      summary: Decline a referral (US-NEW)
      description: Referred talent declines a pending referral.
      operationId: declineReferral
      parameters:
        - name: referralId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Referral declined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
