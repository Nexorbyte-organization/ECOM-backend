      operationId: addPaymentMethod
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, numberOrDetail]
              properties:
                provider:
                  type: string
                  example: "Vodafone Cash"
                numberOrDetail:
                  type: string
                  example: "01012345678"
      responses:
        '201':
          description: Payment method added
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PaymentMethod' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /usher/profile/payment-methods/{methodId}:
    delete:
      tags: [Ushers]
      summary: Delete payment method (US-NEW)
      description: Removes a payment method. If the default is deleted, the next method becomes default.
      operationId: deletePaymentMethod
      parameters:
        - name: methodId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Payment method deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PaymentMethod' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /usher/profile/payment-methods/{methodId}/default:
    patch:
      tags: [Ushers]
      summary: Set default payment method (US-NEW)
      description: Sets a specific payment method as the default; unsets all others.
      operationId: setDefaultPaymentMethod
      parameters:
        - name: methodId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Default updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PaymentMethod' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── ADMINS ──────────────────────────────────────────────────────────────────
  /admin/dashboard:
    get:
      tags: [Admins]
      summary: Admin dashboard
      description: |
        Returns platform-wide stats: user counts, event counts by status,
        flagged talents (lateExcuseCount ≥ 5), recent events, and top-rated talents.
      operationId: getAdminDashboard
      responses:
        '200':
          description: Dashboard statistics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          stats:
                            type: object
                            properties:
                              totalUsers: { type: integer }
                              totalTalents: { type: integer }
                              totalOrganizers: { type: integer }
                              totalEvents: { type: integer }
                              openEvents: { type: integer }
                              completedEvents: { type: integer }
                              cancelledEvents: { type: integer }
                          flaggedTalents:
                            type: array
                            items: { $ref: '#/components/schemas/User' }
                          recentEvents:
                            type: array
                            items: { $ref: '#/components/schemas/Event' }
                          topRatedTalents:
                            type: array
                            items: { $ref: '#/components/schemas/User' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/users:
    get:
      tags: [Admins]
      summary: Get all users
      description: |
        Returns a paginated list of all users. Filterable by `role` and searchable
        by `fullName` or `email` via the `search` query param.
      operationId: adminGetAllUsers
      parameters:
        - name: search
          in: query
          schema: { type: string }
          description: Search by full name or email (case-insensitive).
        - name: role
          in: query
          schema:
            type: string
            enum: [usher, organizer, admin, blocked, all]
          description: Filter by role (use `blocked` to filter blocked users).
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: Paginated users list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admins]
      summary: Invite / create a user (US-309)
      description: |
        Admin creates a user account directly with a specified role. The account
        is pre-verified (`isEmailVerified: true`). Useful for onboarding staff or
        organizers without them going through the public registration flow.
      operationId: adminInviteUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                fullName:
                  type: string
                  example: Sara Ahmed
                email:
                  type: string
                  format: email
                  example: sara@example.com
                password:
                  type: string
                  minLength: 6
                  description: Defaults to `Password@123` if omitted.
                role:
                  type: string
                  enum: [usher, organizer, organizer_member, organizer_supervisor, admin]
                  example: organizer
                city:
                  type: string
                  example: Cairo
                mobileNumber:
                  type: string
                  example: "+201234567890"
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/ushers:
    get:
      tags: [Admins]
      summary: Get all ushers
      description: Returns a paginated list of all users with role `usher`.
      operationId: adminGetUshers
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: Paginated ushers list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/organizers:
    get:
      tags: [Admins]
      summary: Get all organizers
      description: Returns a paginated list of all users with role `organizer`.
      operationId: adminGetOrganizers
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: Paginated organizers list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/users/{id}/block:
    patch:
      tags: [Admins]
      summary: Block a user
      description: |
        Blocks a user account. Business rules:
        - **BR-09**: Admin accounts cannot be blocked.
        - An admin cannot block themselves.
      operationId: blockUser
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: User blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/users/{id}/unblock:
    patch:
      tags: [Admins]
      summary: Unblock a user
      description: Unblocks a user account and sets status back to `verified`.
      operationId: unblockUser
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: User unblocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/users/{id}/verify:
    patch:
      tags: [Admins]
      summary: Verify a user
      description: Manually sets a user's `isVerified` flag to `true`.
      operationId: verifyUser
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: User verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/users/{id}/unverify:
    patch:
      tags: [Admins]
      summary: Unverify a user
      description: Sets a user's `isVerified` flag to `false`.
      operationId: unverifyUser
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: User unverified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/users/{id}:
    delete:
      tags: [Admins]
      summary: Delete a user (US-310)
      description: |
        Permanently deletes a user and their applications. Business rules:
        - Cannot delete own admin account.
        - Cannot delete other admin accounts.
      operationId: adminDeleteUser
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: User deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/users/{id}/status:
    patch:
      tags: [Admins]
      summary: Update user status (legacy)
      description: |
        Legacy endpoint — sets the user's `status` field directly.
        Cannot be used on admin accounts.
      operationId: updateUserStatus
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending, verified, blocked]
                  example: blocked
      responses:
        '200':
          description: User status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/ushers/{id}/reset-excuses:
    post:
      tags: [Admins]
      summary: Reset usher late excuses
      description: |
        Resets the `lateExcuseCount` and `consecutiveGoodEvents` counters
        for a usher account.
      operationId: resetExcuses
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: Late excuse counter reset
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id: { type: string, format: uuid }
                          lateExcuseCount: { type: integer, example: 0 }
                          consecutiveGoodEvents: { type: integer, example: 0 }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/events:
    get:
      tags: [Admins]
      summary: Get all events (platform-wide)
      description: |
        Returns a paginated list of all events on the platform. Filterable by
        `status` and searchable by `title` or `location`.
      operationId: adminGetEvents
      parameters:
        - name: search
          in: query
          schema: { type: string }
          description: Search by event title or location (case-insensitive).
        - name: status
          in: query
          schema:
            type: string
            enum: [open, confirmed, completed, cancelled, all]
          description: Filter by event status.
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: Paginated events list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEvents'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/events/{id}/status:
    patch:
      tags: [Admins]
      summary: Change event status
      description: Manually overrides the status of any event on the platform.
      operationId: adminUpdateEventStatus
      parameters:
        - $ref: '#/components/parameters/EventIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [open, confirmed, completed, cancelled]
                  example: cancelled
      responses:
        '200':
          description: Event status updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Event' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/events/{id}:
    delete:
      tags: [Admins]
      summary: Delete event
      description: |
        Permanently deletes an event **and all its associated applications**.
        This action is irreversible (BR-11).
      operationId: adminDeleteEvent
      parameters:
        - $ref: '#/components/parameters/EventIdParam'
      responses:
        '200':
          description: Event and all related applications deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /usher/events/{id}:
    get:
      tags: [Ushers]
      summary: Get an event available to the current usher
      operationId: getUsherEvent
      parameters:
        - $ref: '#/components/parameters/EventIdParam'
      responses:
        '200': { description: Event details }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /usher/talents:
    get:
      tags: [Ushers]
      summary: List complete usher profiles for referrals
      operationId: listUsherTalents
      responses:
        '200': { description: Paginated usher profiles }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /usher/profile/{id}/reviews:
    get:
      tags: [Ushers]
      summary: Get reviews for an usher
      operationId: getUsherReviews
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Reviews with event details }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /organizer/events/{id}/action-requests:
    post:
      tags: [Organizers]
      summary: Request cancellation or deletion of a non-open event
      operationId: requestEventAction
      parameters:
        - $ref: '#/components/parameters/EventIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestType]
              properties:
                requestType: { type: string, enum: [cancel, delete] }
                reason: { type: string, maxLength: 1000 }
      responses:
        '201': { description: Request submitted for admin review }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: Duplicate pending request or event can be changed directly }

  /organizer/events/{id}/whatsapp-group:
    post:
      tags: [Organizers]
      summary: Create a WhatsApp invitation link for hired ushers
      operationId: createEventWhatsAppGroup
      parameters:
        - $ref: '#/components/parameters/EventIdParam'
      responses:
        '201': { description: Invitation link and included/excluded ushers }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: Link already exists or no ushers are hired }

  /admin/event-action-requests:
    get:
      tags: [Admins]
      summary: List event action requests
      operationId: getEventActionRequests
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected, all], default: pending }
      responses:
        '200': { description: Action requests with organizer and event details }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/event-action-requests/{id}:
    patch:
      tags: [Admins]
      summary: Approve or reject an event action request
      operationId: resolveEventActionRequest
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approved, rejected] }
      responses:
        '200': { description: Request resolved }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Request was already resolved }

  /notifications:
    get:
      tags: [Notifications]
      summary: List current user's notifications
      operationId: getNotifications
      responses:
        '200': { description: Up to 100 newest notifications }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Notifications]
      summary: Clear current user's notifications
      operationId: clearNotifications
      responses:
        '200': { description: Notifications cleared }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/read-all:
    patch:
      tags: [Notifications]
      summary: Mark all current user's notifications as read
      operationId: markAllNotificationsRead
      responses:
        '200': { description: Notifications marked as read }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Mark one notification as read
      operationId: markNotificationRead
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Updated notification }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate a refresh session
      description: Uses the HTTP-only refresh cookie and replaces both session cookies.
      security: []
      responses:
        '200': { description: Session refreshed }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current refresh session and clear cookies
      security: []
      responses:
        '200': { description: Signed out }

  /auth/referral-invites/{token}:
    get:
      tags: [Auth]
      summary: Preview a signed referral invite
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Sanitized event and referrer preview }
        '404': { $ref: '#/components/responses/NotFound' }

  /usher/referral-invites:
    post:
      tags: [Ushers]
      summary: Create a signed referral invite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId]
              properties: { eventId: { type: string, format: uuid } }
      responses:
        '201': { description: Signed invite token }

  /usher/referral-invites/{token}/redeem:
    post:
      tags: [Ushers]
      summary: Redeem a referral invite for the authenticated usher
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Pending referral created }

  /usher/profile/portfolio:
    post:
      tags: [Ushers]
      summary: Upload a portfolio image
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties: { image: { type: string, format: binary } }
      responses:
        '201': { description: Updated portfolio }

  /usher/profile/portfolio/{index}:
    delete:
      tags: [Ushers]
      summary: Delete a portfolio image by zero-based index
      parameters:
        - { name: index, in: path, required: true, schema: { type: integer, minimum: 0 } }
      responses:
        '200': { description: Updated portfolio }

  /organizer/events/{id}/photo:
    patch:
      tags: [Organizers]
      summary: Upload or replace an event photo
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties: { photo: { type: string, format: binary } }
      responses:
        '200': { description: Updated event }

# ──────────────────────────────────────────────────────────────────────────────
# COMPONENTS
# ──────────────────────────────────────────────────────────────────────────────
components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Short-lived JWT obtained from `POST /auth/login`. Browser clients normally
        rely on the secure HTTP-only session cookies instead.

  # ── Parameters ──────────────────────────────────────────────────────────────
  parameters:
    PageParam:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
      description: Page number (1-indexed).

    SizeParam:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      description: Number of items per page.

    SortParam:
      name: sort
      in: query
      schema: { type: string, example: "-createdAt" }
      description: |
        Sort field. Prefix with `-` for descending order.
        Example: `-createdAt` sorts newest first.

    UserIdParam:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: UUID of the user.

    EventIdParam:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: UUID of the event.

  # ── Responses ───────────────────────────────────────────────────────────────
  responses:
    BadRequest:
      description: Validation error or bad input
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            message: "Validation error: eventId is required"

    Unauthorized:
      description: Missing or invalid Bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            message: "Authentication required"

    Forbidden:
      description: Authenticated but not authorized for this action
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            message: "Insufficient permissions"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            message: "User not found"

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            message: "Failed to send verification email. Please try again."

  # ── Schemas ──────────────────────────────────────────────────────────────────
  schemas:

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation completed successfully"

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Something went wrong"

    PaginationMeta:
      type: object
      properties:
        currentPage: { type: integer, example: 1 }
        totalPages: { type: integer, example: 5 }
        totalCount: { type: integer, example: 48 }

    CloudinaryFile:
      type: object
      description: Image metadata returned by Cloudinary after upload.
      properties:
        secure_url:
          type: string
          format: uri
          example: "https://res.cloudinary.com/example/image/upload/v123/ushers/profiles/abc.jpg"
        public_id:
          type: string
          example: "ushers/profiles/abc"

    User:
      type: object
      description: |
        User model. Sensitive fields (password, otp, otpExpiry, otpAttempts,
        lastOtpRequest, otpVerified) are never returned in responses.
      properties:
        id:
          type: string
          format: uuid
          example: "6ba45f12-1234-4562-c3ab-9f963f44bfa4"
        fullName:
          type: string
          example: Ahmed Ali
        userName:
          type: string
          example: ahmed_ali
        email:
          type: string
          format: email
          example: ahmed@example.com
        mobileNumber:
          type: string
          example: "+201234567890"
        city:
          type: string
          example: Cairo
        role:
          type: string
          enum: [usher, organizer, admin]
        experience:
          type: integer
          example: 3
        rate:
          type: number
          format: float
          example: 4.7
        isVerified:
          type: boolean
          example: true
        isBlocked:
          type: boolean
          example: false
        isEmailVerified:
          type: boolean
          example: true
        status:
          type: string
          enum: [pending, verified, blocked]
          example: verified
        lateExcuseCount:
          type: integer
          example: 1
        consecutiveGoodEvents:
          type: integer
          example: 3
        languages:
          type: array
          items:
            type: string
            enum: [arabic, english, french, spanish, german, italian]
          example: [arabic, english]
        eventCategories:
          type: array
          items:
            type: string
            enum: [wedding, corporate, club, festival, private_party, conference, exhibition, sport_event]
          example: [wedding, corporate]
        portfolioPicture:
          $ref: '#/components/schemas/CloudinaryFile'
        portfolio:
          type: array
          items: {}
        organizationInfo:
          type: object
          nullable: true
          description: Organizer-specific data (description, website).
          properties:
            description: { type: string }
            website: { type: string, format: uri }
        createdAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: Soft deletion timestamp; normal responses only contain active records.
        updatedAt:
          type: string
          format: date-time

    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        organizerId:
          type: string
          format: uuid
        title:
          type: string
          example: Annual Corporate Gala
        category:
          type: string
          enum: [wedding, corporate, club, festival, private_party, conference, exhibition, sport_event]
          example: corporate
        status:
          type: string
          enum: [open, confirmed, completed, cancelled]
          example: open
        eventDate:
          type: string
          format: date-time
          example: "2026-08-20T19:00:00Z"
        applicationDeadline:
          type: string
          format: date-time
          example: "2026-08-10T23:59:59Z"
        startTime:
          type: string
          example: "19:00"
        endTime:
          type: string
          example: "23:00"
        location:
          type: string
          example: Cairo Marriott Hotel
        requiredCount:
          type: integer
          example: 10
        genderPreference:
          type: string
          enum: [male, female, any]
          example: any
        budget:
          type: number
          example: 5000
        dressCode:
          type: string
          nullable: true
          example: Formal attire
        notes:
          type: string
          nullable: true
          example: Arabic-speaking ushers preferred
        hiredTalents:
          type: array
          items: { type: string, format: uuid }
          description: List of hired talent UUIDs.
        createdAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: Soft deletion timestamp; normal responses only contain active records.
        updatedAt:
          type: string
          format: date-time

    Application:
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        talentId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, accepted, rejected, excused]
          example: pending
        isDirect:
          type: boolean
          example: false
          description: True if created by a direct-book action.
        referredBy:
          type: string
          format: uuid
          nullable: true
          description: UUID of the talent who referred this applicant.
        appliedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: Soft deletion timestamp; normal responses only contain active records.
        updatedAt:
          type: string
          format: date-time

    Attendance:
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        talentId:
          type: string
          format: uuid
        status:
          type: string
          enum: [present, absent, late]
          example: present
        checkInTime:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: Soft deletion timestamp; normal responses only contain active records.
        updatedAt:
          type: string
          format: date-time

    Review:
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        reviewerId:
          type: string
          format: uuid
          description: UUID of the organizer who wrote the review.
        reviewedUserId:
          type: string
          format: uuid
          description: UUID of the usher being reviewed.
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: string
          nullable: true
          example: "Excellent performance!"
        createdAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: Soft deletion timestamp; normal responses only contain active records.
        updatedAt:
          type: string
          format: date-time

    Referral:
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        referrerTalentId:
          type: string
          format: uuid
          description: UUID of the usher who made the referral.
        referredTalentId:
          type: string
          format: uuid
          description: UUID of the usher being referred.
        status:
          type: string
          enum: [pending, accepted, declined]
          example: pending
        referrer:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
            fullName: { type: string }
        referred:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
            fullName: { type: string }
            rate: { type: number }
            isVerified: { type: boolean }
            lateExcuseCount: { type: integer }
        createdAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: Soft deletion timestamp; normal responses only contain active records.

    EventHistoryItem:
      type: object
      properties:
        event: { $ref: '#/components/schemas/Event' }
        applicationStatus:
          type: string
          enum: [accepted, excused]
        attendanceStatus:
          type: string
          enum: [present, absent, late]
          nullable: true
        rating:
          type: integer
          nullable: true
        comment:
          type: string
          nullable: true

    # ── Request Bodies ─────────────────────────────────────────────────────────
    SignupRequest:
      type: object
      required: [fullName, userName, email, password, mobileNumber, city, experience, role]
      properties:
        fullName:
          type: string
          minLength: 3
          maxLength: 50
          example: Ahmed Ali
        userName:
          type: string
          minLength: 3
          maxLength: 30
          example: ahmed_ali
        email:
          type: string
          format: email
          example: ahmed@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: StrongPass@123
        mobileNumber:
          type: string
          pattern: '^(\+?\d{1,3}[- ]?)?\d{10}$'
          example: "+201234567890"
        city:
          type: string
          example: Cairo
        experience:
          type: integer
          minimum: 0
          example: 2
        role:
          type: string
          enum: [usher, organizer, admin]
          example: usher
        languages:
          type: array
          items:
            type: string
            enum: [arabic, english, french, spanish, german, italian]
        eventCategories:
          type: array
          items:
            type: string
            enum: [wedding, corporate, club, festival, private_party, conference, exhibition, sport_event]
        portfolio:
          type: array
          items: {}

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    UsherUpdateProfileRequest:
      type: object
      properties:
        fullName: { type: string, example: Ahmed Ali }
        city: { type: string, example: Alexandria }
        experience: { type: integer, minimum: 0, example: 3 }
        languages:
          type: array
          items:
            type: string
            enum: [arabic, english, french, spanish, german, italian]
        eventCategories:
          type: array
          items:
            type: string
            enum: [wedding, corporate, club, festival, private_party, conference, exhibition, sport_event]

    CreateEventRequest:
      type: object
      required: [title, category, eventDate, applicationDeadline, startTime, endTime, location, requiredCount, budget]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 100
        category:
          type: string
          enum: [wedding, corporate, club, festival, private_party, conference, exhibition, sport_event]
        eventDate:
          type: string
          format: date-time
          description: Must be a future date.
        applicationDeadline:
          type: string
          format: date-time
          description: Must be before eventDate.
        startTime:
          type: string
          example: "19:00"
        endTime:
          type: string
          example: "23:00"
        location:
          type: string
          example: Cairo Marriott Hotel
        requiredCount:
          type: integer
          minimum: 1
          example: 10
        genderPreference:
          type: string
          enum: [male, female, any]
          default: any
        budget:
          type: number
          minimum: 0
          example: 5000
        dressCode:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true

    UpdateEventRequest:
      type: object
      description: Any subset of the allowed event fields can be updated.
      properties:
        title: { type: string }
        category:
          type: string
          enum: [wedding, corporate, club, festival, private_party, conference, exhibition, sport_event]
        eventDate: { type: string, format: date-time }
        applicationDeadline: { type: string, format: date-time }
        startTime: { type: string }
        endTime: { type: string }
        location: { type: string }
        requiredCount: { type: integer, minimum: 1 }
        genderPreference:
          type: string
          enum: [male, female, any]
        budget: { type: number }
        dressCode: { type: string }
        notes: { type: string }

    # ── Paginated Wrappers ─────────────────────────────────────────────────────
    PaginatedUsers:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - $ref: '#/components/schemas/PaginationMeta'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/User' }

    PaginatedEvents:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - $ref: '#/components/schemas/PaginationMeta'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Event' }

    PaginatedApplications:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - $ref: '#/components/schemas/PaginationMeta'
        - type: object
          properties:
            data:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/Application'
                  - type: object
                    properties:
                      event: { $ref: '#/components/schemas/Event' }
                      referredByName: { type: string, nullable: true }

    PaymentMethod:
      type: object
      properties:
        id:
          type: string
          description: UUID generated server-side
          example: "a1b2c3d4-5678-90ab-cdef-1234567890ab"
        provider:
          type: string
          example: "Vodafone Cash"
        numberOrDetail:
          type: string
          example: "01012345678"
        isDefault:
          type: boolean
          example: true

    StaffMember:
      type: object
      description: A user with role `organizer_member` or `organizer_supervisor` linked to an organizer.
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
          example: Mohamed Hassan
        email:
          type: string
          format: email
          example: staff@company.com
        role:
          type: string
          enum: [organizer_member, organizer_supervisor]
          example: organizer_member
        isBlocked:
          type: boolean
          example: false
        isVerified:
          type: boolean
          example: false
        providerOwnerId:
          type: string
          format: uuid
          description: ID of the organizer this staff belongs to
        createdAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: Soft deletion timestamp; normal responses only contain active records.
        updatedAt:
          type: string
          format: date-time
